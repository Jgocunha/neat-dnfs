name: Documentation Sync Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - 'neat-dnfs/include/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  doc-sync:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check documentation completeness with Gemini
        id: gemini_doc_sync
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@055c24c9f565debe282e4adf1f7ca1715040ebe2 # v0 (2026-06-19)
        with:
          gemini_cli_version: latest
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            This pull request modifies one or more public API headers under
            `neat-dnfs/include/`. Audit the documentation impact and post a
            single PR comment listing what needs updating. Do NOT commit or modify any files.

            Repository: ${{ github.repository }}
            PR number: ${{ github.event.pull_request.number }}

            Project layout:
            - Public headers: neat-dnfs/include/**/*.h
            - README:         README.md (top-level)
            - Changelog:      CHANGELOG.md (top-level)

            Doxygen convention: every public function, class, and struct in
            include/ must have a Doxygen block with at minimum @brief, one @param per parameter,
            and @return (unless void).

            Steps:
            1. Run: gh pr diff ${{ github.event.pull_request.number }}
               to see the changed files and lines.

            2. For each changed header file, check:

               a) Doxygen — new public functions/methods: does each have a complete block?
                  Existing functions with changed signatures: is the Doxygen still accurate?
                  List each issue as: include/path/file.h — FunctionName: what is missing.

               b) README — scan README.md for code snippets using the changed API. List any
                  snippets that may need updating with an approximate line reference.

               c) CHANGELOG — if the API change is notable (new feature, behaviour change,
                  parameter rename), flag that CHANGELOG.md may need an entry under [Unreleased].

            3. Post the findings as a PR comment:
               gh pr comment ${{ github.event.pull_request.number }} --body "..."

               Use this structure in the comment body:
               ## Documentation sync check

               ### Doxygen
               - [ ] include/path/file.h — FunctionName: missing @param x

               ### README
               - [ ] Line ~42: snippet uses old constructor signature

               ### CHANGELOG
               - [ ] Consider adding entry under [Unreleased] for the Genome API change

               Write "No issues found." under any heading with nothing to report.
               One line per item. Do not suggest replacement wording — only identify what needs attention.
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The Gemini free tier used here allows a fixed number of requests per
      # day across the whole repository, so this check can fail simply because
      # some other job used up the quota first -- not because of anything in
      # this PR. continue-on-error above keeps that from blocking the PR; this
      # step re-raises the failure if it was for any other reason, so a real
      # problem (bad prompt, revoked key, action bug) still fails the job.
      - name: Evaluate Gemini result
        if: always() && steps.gemini_doc_sync.outcome == 'failure'
        env:
          GEMINI_ERROR: ${{ steps.gemini_doc_sync.outputs.error }}
        run: |
          # Errors also reach this step as plain stderr text rather than JSON
          # (the action falls back to raw stderr when it isn't valid JSON), so
          # this also matches "HTTP 429" / "429 Too Many Requests" phrasing,
          # not just the JSON "code": 429 field.
          if grep -qiE 'exhausted your daily quota|RESOURCE_EXHAUSTED|Too Many Requests|\b429\b' <<< "$GEMINI_ERROR"; then
            echo "::warning title=Gemini doc-sync skipped::Gemini free-tier daily quota is exhausted; documentation sync check skipped, not failed. Re-run later or check manually."
            exit 0
          fi
          echo "::error title=Gemini doc-sync failed::Gemini CLI failed for a reason other than quota exhaustion; see the 'Check documentation completeness with Gemini' step above."
          exit 1
